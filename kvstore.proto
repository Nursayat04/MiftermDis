syntax = "proto3";

package kvstore;

enum ReadConsistency {
  LINEARIZABLE = 0;   // Must hit Leaseholder / Quorum
  FOLLOWER_STALE = 1; // Served by local replica; bounded staleness
}

enum WriteStrategy {
  QUORUM_CP = 0; // Requires majority (N/2 + 1) ACKs; fails if quorum lost
  ALWAYS_AP = 1; // Accepts write on any available node; logs timestamp (LWW)
}

message GetRequest {
  string key = 1;
  ReadConsistency consistency = 2;
  uint32 max_staleness_ms = 3; // Used when consistency == FOLLOWER_STALE (0 = no bound)
}

message GetReply {
  string value = 1;
  bool found = 2;
  uint64 read_timestamp = 3;
  bool is_stale = 4;
}

message PutRequest {
  string key = 1;
  string value = 2;
  string idempotency_key = 3;
  WriteStrategy strategy = 4;
  uint64 timestamp = 5; // 0 = server assigns (microseconds)
}

message PutReply {
  bool success = 1;
  uint32 acks_received = 2;
  string error_message = 3;
}

// ---------------------------------------------------------------------------
// Additions for replication and failure injection (not in the lab's base proto)
// ---------------------------------------------------------------------------

enum ReplicationKind {
  HEARTBEAT = 0; // leaseholder -> followers: liveness, resets follower staleness clock
  VOTE = 1;      // CP phase 1: "are you reachable?" (counts toward the quorum)
  COMMIT = 2;    // CP phase 2 / AP push: apply (key, value, timestamp) with LWW
  SYNC = 3;      // background anti-entropy: apply (key, value, timestamp) with LWW
}

message ReplicateRequest {
  ReplicationKind kind = 1;
  string key = 2;
  string value = 3;
  uint64 timestamp = 4;
  string sender = 5; // "host:port" of the sending replica
}

message ReplicateReply {
  bool ok = 1;
}

// Failure injection: the replica refuses to talk to the listed peers
// (both outgoing and incoming), which simulates a network partition.
message PartitionRequest {
  repeated string blocked_peers = 1;
}

message PartitionReply {
  bool ok = 1;
}

service KeyValueStore {
  rpc Get (GetRequest) returns (GetReply);
  rpc Put (PutRequest) returns (PutReply);
  rpc Replicate (ReplicateRequest) returns (ReplicateReply);
  rpc SetPartition (PartitionRequest) returns (PartitionReply);
}
